version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - safepay-network

  # Web Dashboard
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    restart: unless-stopped
    networks:
      - safepay-network

  # USSD Service
  ussd-service:
    build:
      context: ./ussd-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - USSD_PORT=4000
      - BACKEND_API_URL=http://backend:3000/api
    env_file:
      - ./ussd-service/.env
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - safepay-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - safepay-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - web-dashboard
      - ussd-service
    restart: unless-stopped
    networks:
      - safepay-network

volumes:
  redis-data:

networks:
  safepay-network:
    driver: bridge
